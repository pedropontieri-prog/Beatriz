<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palmeiras Ouro</title>

<style>
:root {
    --green: #0b6623;
    --gold: #ffd700;
    --bg: #f4f6f5;
    --text: #222;
}

body.dark {
    --bg: #121212;
    --text: #eee;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

header {
    background: linear-gradient(90deg, var(--green), #145a32);
    color: white;
    padding: 30px;
    text-align: center;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

header h1 {
    font-size: 36px;
    letter-spacing: 2px;
}

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.filter-btn { background: white; color: var(--green); }
.filter-btn:hover { background: var(--gold); transform: scale(1.1); }

.toggle-dark { background: black; color: white; }

.search {
    margin: 25px auto;
    display: block;
    padding: 12px;
    width: 300px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.container { padding: 40px; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: 0.4s;
    cursor: pointer;
}

body.dark .card { background: #1e1e1e; }

.card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 12px 30px rgba(0,0,0,0.3);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card-content { padding: 20px; }

.card h2 {
    color: var(--green);
}

.badge {
    margin-top: 10px;
    background: var(--gold);
    padding: 8px;
    border-radius: 6px;
    text-align: center;
    font-weight: bold;
}

.hidden { display: none; }

.modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    display: none;
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 25px;
    border-radius: 10px;
    max-width: 400px;
    text-align: center;
    animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

footer {
    text-align: center;
    padding: 25px;
    background: var(--green);
    color: white;
    margin-top: 40px;
}
</style>
</head>
<body>

<header>
<h1>Palmeiras Ouro Experience</h1>
<nav>
<button class="filter-btn" onclick="filtrar('all')">Tudo</button>
<button class="filter-btn" onclick="filtrar('historia')">História</button>
<button class="filter-btn" onclick="filtrar('titulos')">Títulos</button>
<button class="filter-btn" onclick="filtrar('elenco')">Elenco</button>
<button class="filter-btn" onclick="filtrar('camisa')">Camisas</button>
<button class="filter-btn" onclick="filtrar('jogos')">Jogos</button>
<button class="toggle-dark" onclick="darkMode()">🌙</button>
<button onclick="login()">Login</button>
</nav>
</header>

<input class="search" placeholder="Pesquisar..." onkeyup="buscar(this.value)">

<div class="container">
<div class="grid">

<div class="card historia" onclick="window.location.href='historias.html'">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Allianz_Parque.jpg">
<div class="card-content"><h2>História</h2><div class="badge">Desde 1914</div></div>
</div>

<div class="card titulos" onclick="window.location.href='titulos.html'">
<img src="https://upload.wikimedia.org/wikipedia/commons/2/2e/Copa_Libertadores.png">
<div class="card-content"><h2>Títulos</h2><div class="badge">Gigante</div></div>
</div>

<div class="card camisa" onclick="window.location.href='camisa.html'">
<img src="https://upload.wikimedia.org/wikipedia/commons/3/3a/Palmeiras_jersey.jpg">
<div class="card-content"><h2>Camisas</h2><div class="badge">Verde</div></div>
</div>

<div class="card elenco" onclick="window.location.href='elenco.html'">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/7a/Football_team.jpg">
<div class="card-content"><h2>Elenco</h2><div class="badge">Atual</div></div>
</div>

<div class="card jogos" onclick="window.location.href='jogos.html'">
<img src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Football_match.jpg">
<div class="card-content"><h2>Jogos Marcantes</h2><div class="badge">Históricos</div></div>
</div>

</div>

<h2 style="margin-top:40px">Estatísticas Dinâmicas</h2>
<p id="stats">Jogos: 0 | Vitórias: 0 | Gols: 0</p>
<button onclick="gerarStats()">Gerar</button>

</div>

<div class="modal" id="modal">
<div class="modal-content">
<p id="modal-text"></p>
<button onclick="fecharModal()">Fechar</button>
</div>
</div>

<footer>Sociedade Esportiva Palmeiras</footer>

<script>
function filtrar(cat){
 document.querySelectorAll('.card').forEach(c=>{
  c.classList.toggle('hidden', cat!=='all' && !c.classList.contains(cat));
 });
}

function buscar(txt){
 txt = txt.toLowerCase();
 document.querySelectorAll('.card').forEach(c=>{
  c.style.display = c.innerText.toLowerCase().includes(txt) ? 'block':'none';
 });
}

function darkMode(){ document.body.classList.toggle('dark'); }

function abrirModal(texto){
 document.getElementById('modal').style.display='flex';
 document.getElementById('modal-text').innerText=texto;
}

function fecharModal(){ document.getElementById('modal').style.display='none'; }

function gerarStats(){
 let jogos = Math.floor(Math.random()*60);
 let vitorias = Math.floor(Math.random()*jogos);
 let gols = Math.floor(Math.random()*100);
 document.getElementById('stats').innerText =
 `Jogos: ${jogos} | Vitórias: ${vitorias} | Gols: ${gols}`;
}

function login(){
 let nome = prompt('Digite seu nome:');
 if(nome) alert('Bem-vindo, '+nome);
}
</script>

</body>
</html>
