<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palmeiras Ouro</title>

<style>
:root {
    --green: #0b6623;
    --gold: #ffd700;
    --bg: #f4f6f5;
    --text: #222;
}

body.dark {
    --bg: #121212;
    --text: #eee;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

header {
    background: linear-gradient(90deg, var(--green), #145a32);
    color: white;
    padding: 30px;
    text-align: center;
}

nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 15px;
}

button {
    padding: 10px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.filter-btn { background: white; color: var(--green); }
.toggle-dark { background: black; color: white; }

.search {
    margin: 25px auto;
    display: block;
    padding: 12px;
    width: 300px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

.container { padding: 40px; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
}

.card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    transition: 0.4s;
    cursor: pointer;
}

body.dark .card { background: #1e1e1e; }

.card:hover {
    transform: translateY(-10px) scale(1.05);
}

.card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
}

.card-content { padding: 20px; }

.card h2 { color: var(--green); }

.badge {
    margin-top: 10px;
    background: var(--gold);
    padding: 8px;
    border-radius: 6px;
    text-align: center;
    font-weight: bold;
}

.hidden { display: none; }

footer {
    text-align: center;
    padding: 25px;
    background: var(--green);
    color: white;
    margin-top: 40px;
}
</style>
</head>
<body>

<header>
<h1>Palmeiras Experience</h1>
<nav>
<button class="filter-btn" onclick="filtrar('all')">Tudo</button>
<button class="filter-btn" onclick="filtrar('historia')">História</button>
<button class="filter-btn" onclick="filtrar('titulos')">Títulos</button>
<button class="filter-btn" onclick="filtrar('elenco')">Elenco</button>
<button class="filter-btn" onclick="filtrar('camisa')">Camisas</button>
<button class="filter-btn" onclick="filtrar('jogos')">Jogos</button>
<button class="filter-btn" onclick="filtrar('hino')">Hino e Canções do Verdão</button>
<button class="toggle-dark" onclick="darkMode()">🌙</button>
<button onclick="login()">Login</button>
</nav>
</header>

<input class="search" placeholder="Pesquisar..." onkeyup="buscar(this.value)">

<div class="container">

<div class="grid">

<a href="historias.html" style="text-decoration:none; color:inherit;">
  <div class="card historia">
    <img src="history.png">
    <div class="card-content">
      <h2>História</h2>
      <div class="badge">Desde 1914</div>
    </div>
  </div>
</a>

<a href="titulos.html" style="text-decoration:none; color:inherit;">
  <div class="card titulos">
    <img src="maio.png">
    <div class="card-content">
      <h2>Títulos</h2>
      <div class="badge">Gigante</div>
    </div>
  </div>
</a>

<a href="camisa.html" style="text-decoration:none; color:inherit;">
  <div class="card camisa">
    <img src="usar.png">
    <div class="card-content">
      <h2>Camisas e Escudos</h2>
      <div class="badge">Verde</div>
    </div>
  </div>
</a>

<a href="elenco.html" style="text-decoration:none; color:inherit;">
  <div class="card elenco">
    <img src="imagem.png">
    <div class="card-content">
      <h2>Elenco</h2>
      <div class="badge">Todos os tempos</div>
    </div>
  </div>
</a>

<a href="jogos.html" style="text-decoration:none; color:inherit;">
  <div class="card jogos">
    <img src="luiz.png">
    <div class="card-content">
      <h2>Jogos Marcantes</h2>
      <div class="badge">Histórico</div>
    </div>
  </div>
</a>

<a href="hino.html" style="text-decoration:none; color:inherit;">
  <div class="card hino">
   <img src="palmeiras.png">
    <div class="card-content">
      <h2>Hinos e Canções</h2>
      <div class="badge"> Belas Músicas</div>
    </div>
  </div>
</a>
</div>

<h2 style="margin-top:40px">Estatísticas Dinâmicas</h2>
<p id="stats">Jogos: 0 | Vitórias: 0 | Gols: 0</p>
<button onclick="gerarStats()">Gerar</button>

</div>

<footer>Sociedade Esportiva Palmeiras</footer>

<script>
function filtrar(cat){
 document.querySelectorAll('.card').forEach(c=>{
  c.classList.toggle('hidden', cat!=='all' && !c.classList.contains(cat));
 });
}

function buscar(txt){
 txt = txt.toLowerCase();
 document.querySelectorAll('.card').forEach(c=>{
  c.style.display = c.innerText.toLowerCase().includes(txt) ? '' : 'none';
 });
}

function darkMode(){
 document.body.classList.toggle('dark');
}

function gerarStats(){
 let jogos = Math.floor(Math.random()*60);
 let vitorias = Math.floor(Math.random()*jogos);
 let gols = Math.floor(Math.random()*100);
 document.getElementById('stats').innerText =
 `Jogos: ${jogos} | Vitórias: ${vitorias} | Gols: ${gols}`;
}

function login(){
 let nome = prompt('Digite seu nome:');
 if(nome) alert('Bem-vindo, '+nome);
}
</script>

</body>
</html>
