<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palmeiras Player</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:#121212;
    color:white;
}

header{
    text-align:center;
    padding:20px;
    background:#0b6623;
}

.lista{
    padding:15px;
    padding-bottom:120px;
}

/* ITEM */
.musica{
    display:flex;
    align-items:center;
    gap:15px;
    padding:12px;
    border-radius:12px;
    margin-bottom:12px;
    background:#1e1e1e;
    cursor:pointer;
    transition:.3s;
}

.musica:hover{
    background:#2a2a2a;
    transform:scale(1.02);
}

.musica img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:10px;
}

/* GARANTE QUE O TEXTO NÃO BLOQUEIE O CLIQUE */
.musica span{
    font-size:16px;
    pointer-events:none;
}

.player{
    position:fixed;
    bottom:0;
    width:100%;
    background:#000;
    padding:10px;
}

video{
    width:100%;
    height:80px;
}
</style>

</head>

<body>

<header>
<h1>🎶 Hinos & Cantos do Palmeiras</h1>
<p>Clique no nome para tocar 👇</p>
</header>

<div class="lista">

<div class="musica" onclick="tocar("HINO DO PALMEIRAS.mp4")">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg">
<span>Hino do Palmeiras</span>
</div>

<div class="musica" onclick="tocar("O PALMEIRAS É O TIME DA VIRADA - Mancha Verde - Letras.mp4")">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg">
<span>Time da Virada</span>
</div>
    
<div class="musica" onclick="tocar()">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg">
<span>Vamos Pra Cima Porco</span>
</div>

<div class="musica" onclick="tocar()">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg">
<span>Largo Tudo Só Pra Te Ver</span>
</div>

<div class="musica" onclick="tocar()">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg">
<span>Aqui Tem Um Bando de Porco</span>
</div>

<div class="musica" onclick="tocar()">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg">
<span>Palmeiras Fiu Fiu</span>
</div>

<div class="musica" onclick="tocar()">
<img src="https://upload.wikimedia.org/wikipedia/commons/1/10/Palmeiras_logo.svg">
<span>E a Gambazada Viverá a Chorar</span>
</div>

</div>

<div class="player">
<video id="player" controls src="hino-palmeiras.mp4"></video>
</div>

<script>
function tocar(musica){
    const player = document.getElementById("player");
    player.src = musica;
    player.play();
}
</script>

</body>
</html>
